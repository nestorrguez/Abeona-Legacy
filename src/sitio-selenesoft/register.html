<!DOCTYPE html>
<html lang="en">
  <head>
        <title>SeleneSoft - Login </title>
        <meta name="viewport" content="width-device-width, user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1">
        <link rel="stylesheet" href="css/bootstrap.min.css">
        <link rel="stylesheet" href="css/style.css">
        <link rel="stylesheet" href="css/style-responsive.css">
  </head>

  <body class="log">

	  <div id="login-page">
          <div class="container">
	  	
              <form class="form-login" action="index.html">
		        <h2 class="form-login-heading">REGÍSTRATE</h2>
		        <div class="login-wrap">
		            <input type="text" class="form-control" placeholder="Usuario" autofocus>
		            <br>
                    <input type="text" class="form-control" placeholder="Correo Electrónico" autofocus>
                    <br>
		            <input type="password" class="form-control" placeholder="Contraseña">
                    <br>
                    <input type="password" class="form-control" placeholder="Repetir Contraseña">
                    <br>
		            <button class="btn-log btn btn-primary btn-block" href="index.html" type="submit"><i class="fa fa-lock"></i> REGISTRAR</button>
		            <hr>
		        </div>
              </form>	  	
          </div>
        </div>

        <script type='text/javascript' src="//ajax.googleapis.com/ajax/libs/jquery/2.0.2/jquery.min.js"></script>
        <script src="js/bootstrap.min.js" type="text/javascript"></script>


    </body>
</html>
