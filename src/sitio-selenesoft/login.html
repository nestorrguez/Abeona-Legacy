<!DOCTYPE html>
<html lang="en">
  <head>
        <title>SeleneSoft - Login </title>
        <meta name="viewport" content="width-device-width, user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1">
        <link rel="stylesheet" href="css/bootstrap.min.css">
        <link rel="stylesheet" href="css/style.css">
        <link rel="stylesheet" href="css/style-responsive.css">
  </head>

  <body class="log">

	  <div id="login-page">
          <div class="container">
	  	
              <form class="form-login" action="index.html">
		        <h2 class="form-login-heading">Iniciar Session</h2>
		        <div class="login-wrap">
		            <input type="text" class="form-control" placeholder="Usuario" autofocus>
		            <br>
		            <input type="password" class="form-control" placeholder="Contraseña">
		            <label class="checkbox">
		                <span class="pull-right">
		                    <a data-toggle="modal" class="stylelog" href="login.html#myModal">Olvidé contraseña</a>
		
		                </span>
		            </label>
		            <button class="btn-log btn btn-primary btn-block" href="index.html" type="submit"><i class="fa fa-lock"></i> INICIAR</button>
		            <hr>
		            

		            <div class="registration">
		                ¿No te encuentras registrado?<br/>
		                <a class="stylelog" href="register.html">
		                  Crear una cuenta
		                </a>
		            </div>
		
		        </div>
		        <div aria-hidden="true" aria-labelledby="myModalLabel" role="dialog" tabindex="-1" id="myModal" class="modal fade">
		              <div class="modal-dialog">
		                  <div class="modal-content">
		                      <div class="modal-header">
		                          <button type="button" class="close" data-dismiss="modal" aria-hidden="true">&times;</button>
		                          <h4 class="modal-title">Olvidé contraseña</h4>
		                      </div>
		                      <div class="modal-body">
		                          <p class="text-modal">Ingresa tu correo electrónico para enviar tu contraseña.</p>
		                          <input type="text" name="email" placeholder="Email" autocomplete="off" class="form-control placeholder-no-fix">
		
		                      </div>
		                      <div class="modal-footer">
		                          <button data-dismiss="modal" class="btn btn-default" type="button">Cancelar</button>
		                          <button class="btn btn-danger" type="button">Enviar</button>
		                      </div>
		                  </div>
		              </div>
		          </div>
              </form>	  	
          </div>
        </div>

        <script type='text/javascript' src="//ajax.googleapis.com/ajax/libs/jquery/2.0.2/jquery.min.js"></script>
        <script src="js/bootstrap.min.js" type="text/javascript"></script>


    </body>
</html>
